<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Rec versionamento</title>
</head>
<body>
    <script>
    
                 let num = parseInt (prompt("Informe um numero:"))
            
            if (num % 2 == 0) {
                 alert ("Par") 
             }else{
                 alert ("Impar")
             }

             if (num > 0) {
                 alert ("Positivo")
             } else if (num < 0) {
               alert ("Negativo")
                } else {
                   alert ("Neutro")
                }
    
    </script>
</body>
</html>
